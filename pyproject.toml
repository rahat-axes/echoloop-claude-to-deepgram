[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echoloop"
version = "0.1.1"
description = "Deepgram speech tools for Claude's tool-use loop. Let Claude transcribe, speak, and read sentiment on demand."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Rahat Masum", email = "rahatapu103@gmail.com" }]
keywords = ["deepgram", "claude", "anthropic", "tool-use", "speech-to-text", "text-to-speech"]
dependencies = [
    "anthropic>=0.40",
    "deepgram-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/rahat-axes/echoloop-claude-to-deepgram/"
Repository = "https://github.com/rahat-axes/echoloop-claude-to-deepgram/"

[tool.hatch.build.targets.wheel]
packages = ["src/echoloop"]

[tool.hatch.build.targets.sdist]
include = ["src/echoloop", "README.md", "LICENSE", "pyproject.toml"]